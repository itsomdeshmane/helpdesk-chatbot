[pytest]
# Pytest configuration for SOLID architecture tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v                          # Verbose output
    --strict-markers            # Error on unknown markers
    --tb=short                  # Short traceback format
    --disable-warnings          # Disable warnings
    -p no:cacheprovider         # Disable cache
    --asyncio-mode=auto         # Auto async mode

# Markers (for test categorization)
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with real dependencies)
    slow: Slow tests
    requires_db: Requires database connection
    requires_openai: Requires OpenAI API key
    requires_pinecone: Requires Pinecone connection

# Asyncio configuration
asyncio_mode = auto

# Coverage options (optional)
# Uncomment to enable coverage reporting
# addopts = --cov=. --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO

